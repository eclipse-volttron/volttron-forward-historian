[tool.poetry]
name = "volttron-forward-historian"
version = "5.1"
description = "VOLTTRON historian that forwards data to another VOLTTRON instance"
authors = ["VOLTTRON Team <volttron@pnnl.gov>"]
license = "Apache-2.0"
packages = [
    { include = "historian", from = "src" }
]
include = ["config"]
homepage = "https://github.com/VOLTTRON/volttron-forward-historian"
repository = "https://github.com/VOLTTRON/volttron-forward-historian"

keywords = ["volttron", "agent"]

[tool.poetry.dependencies]
python = ">=3.8,<4.0"
volttron-lib-base-historian = ">=2.0.0rc0"

[tool.poetry.dev-dependencies]
pre-commit = "^2.13.0"
pytest = "^6.2.4"
black = "^21.6b0"
flake8 = "^3.9.2"

[tool.poetry.scripts]
forwarder-agent = "historian.forwarder.forwarder:main"



[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/'''
